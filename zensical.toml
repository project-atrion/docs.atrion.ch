[project]
site_name = "Atrion Dokumentation"
site_description = "Öffentliche Benutzer- und Technikdokumentation von Atrion, der offenen Liegenschaftsverwaltung."
site_url = "https://docs.atrion.ch/"
site_author = "Project Atrion"
repo_url = "https://github.com/project-atrion/docs.atrion.ch"
repo_name = "project-atrion/docs.atrion.ch"
edit_uri = "edit/main/docs/"
copyright = "© Project Atrion · Inhalte unter CC BY 4.0"
extra_css = ["assets/stylesheets/fonts.css", "assets/stylesheets/atrion.css"]

# Navigation wird von scripts/gen_nav.py erzeugt, bitte nicht von Hand ändern.
# NAV-START
nav = [
  { "Start" = "index.md" },
  { "Benutzer" = [
    "benutzer/index.md",
    { "Grundlagen" = [
      "benutzer/grundlagen/index.md",
      { "Anmelden" = "benutzer/grundlagen/anmelden.md" },
      { "Abmelden" = "benutzer/grundlagen/abmelden.md" },
      { "Passwort zurücksetzen" = "benutzer/grundlagen/passwort-zuruecksetzen.md" },
      { "Passwort ändern" = "benutzer/grundlagen/passwort-aendern.md" },
      { "Zwei-Faktor-Anmeldung einrichten" = "benutzer/grundlagen/zwei-faktor-einrichten.md" },
      { "Von allen Geräten abmelden" = "benutzer/grundlagen/alle-geraete-abmelden.md" },
      { "Sprache wechseln" = "benutzer/grundlagen/sprache-wechseln.md" },
      { "Zeitzone einstellen" = "benutzer/grundlagen/zeitzone-einstellen.md" },
      { "Profil und E-Mail-Signatur" = "benutzer/grundlagen/profil-und-signatur.md" },
      { "Benachrichtigungen per E-Mail oder in Atrion" = "benutzer/grundlagen/benachrichtigungen.md" },
      { "Darstellung hell oder dunkel" = "benutzer/grundlagen/darstellung.md" },
      { "Apps und Menüs" = "benutzer/grundlagen/apps-und-menues.md" },
      { "Befehlspalette" = "benutzer/grundlagen/befehlspalette.md" },
      { "Tastaturkürzel" = "benutzer/grundlagen/tastaturkuerzel.md" },
      { "Ansichten wechseln" = "benutzer/grundlagen/ansichten-wechseln.md" },
      { "Suchen" = "benutzer/grundlagen/suchen.md" },
      { "Filtern" = "benutzer/grundlagen/filtern.md" },
      { "Gruppieren" = "benutzer/grundlagen/gruppieren.md" },
      { "Favoriten speichern" = "benutzer/grundlagen/favoriten.md" },
      { "Sortieren und blättern" = "benutzer/grundlagen/sortieren-und-blaettern.md" },
      { "Spalten ein- und ausblenden" = "benutzer/grundlagen/spalten-anpassen.md" },
      { "Mehrere Datensätze auswählen und bearbeiten" = "benutzer/grundlagen/auswaehlen-und-massenbearbeitung.md" },
      { "Datensatz anlegen und bearbeiten" = "benutzer/grundlagen/datensatz-bearbeiten.md" },
      { "Änderungen verwerfen" = "benutzer/grundlagen/aenderungen-verwerfen.md" },
      { "Datensatz duplizieren" = "benutzer/grundlagen/duplizieren.md" },
      { "Archivieren, wiederherstellen und löschen" = "benutzer/grundlagen/archivieren-und-loeschen.md" },
      { "Exportieren" = "benutzer/grundlagen/exportieren.md" },
      { "Importieren" = "benutzer/grundlagen/importieren.md" },
      { "Nachrichten und Notizen" = "benutzer/grundlagen/chatter.md" },
      { "Aktivitäten planen" = "benutzer/grundlagen/aktivitaeten.md" },
      { "Datensätzen folgen" = "benutzer/grundlagen/folgen.md" },
      { "Anhänge hinzufügen" = "benutzer/grundlagen/anhaenge.md" },
      { "Posteingang und Erwähnungen" = "benutzer/grundlagen/posteingang.md" },
      { "Direktnachrichten und Kanäle" = "benutzer/grundlagen/discuss.md" },
      { "Benutzer:in einladen" = "benutzer/grundlagen/benutzer-einladen.md" },
      { "Zugriffsrechte setzen" = "benutzer/grundlagen/zugriffsrechte-setzen.md" },
      { "Passwort einer Person zurücksetzen" = "benutzer/grundlagen/passwort-fuer-andere-zuruecksetzen.md" },
    ] },
  ] },
  { "Technik" = "technik/index.md" },
]
# NAV-ENDE

[project.theme]
language = "de"
logo = "assets/images/logo-weiss.svg"
favicon = "assets/images/favicon.svg"
# Schriften lokal ausgeliefert (keine Google Fonts), siehe assets/stylesheets/fonts.css
font = false
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Dunkle Darstellung"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Helle Darstellung"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
