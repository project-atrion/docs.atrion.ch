[project]
site_name = "Atrion Dokumentation"
site_description = "Öffentliche Benutzer- und Technikdokumentation von Atrion, der offenen Liegenschaftsverwaltung."
site_url = "https://docs.atrion.ch/"
site_author = "Project Atrion"
repo_url = "https://github.com/project-atrion/docs.atrion.ch"
repo_name = "project-atrion/docs.atrion.ch"
edit_uri = "edit/main/docs/"
copyright = "© Project Atrion · Inhalte unter CC BY 4.0"
extra_css = ["assets/stylesheets/fonts.css", "assets/stylesheets/atrion.css"]

# Navigation wird von scripts/gen_nav.py erzeugt, bitte nicht von Hand ändern.
# NAV-START
nav = [
  { "Start" = "index.md" },
  { "Benutzer" = [
    "benutzer/index.md",
    { "Anmeldung und Sicherheit" = [
      "benutzer/anmeldung-und-sicherheit/index.md",
      { "Anmelden" = "benutzer/anmeldung-und-sicherheit/anmelden.md" },
      { "Abmelden" = "benutzer/anmeldung-und-sicherheit/abmelden.md" },
      { "Von allen Geräten abmelden" = "benutzer/anmeldung-und-sicherheit/alle-geraete-abmelden.md" },
      { "Passwort zurücksetzen" = "benutzer/anmeldung-und-sicherheit/passwort-zuruecksetzen.md" },
      { "Passwort ändern" = "benutzer/anmeldung-und-sicherheit/passwort-aendern.md" },
      { "Zwei-Faktor-Anmeldung einrichten" = "benutzer/anmeldung-und-sicherheit/zwei-faktor-einrichten.md" },
      { "Mit zweitem Faktor anmelden" = "benutzer/anmeldung-und-sicherheit/zwei-faktor-anmelden.md" },
      { "Passkey einrichten" = "benutzer/anmeldung-und-sicherheit/passkey-einrichten.md" },
      { "Mit Passkey anmelden" = "benutzer/anmeldung-und-sicherheit/passkey-anmelden.md" },
      { "Passkey entfernen" = "benutzer/anmeldung-und-sicherheit/passkey-entfernen.md" },
    ] },
    { "Persönliche Einstellungen" = [
      "benutzer/persoenliche-einstellungen/index.md",
      { "Sprache wechseln" = "benutzer/persoenliche-einstellungen/sprache-wechseln.md" },
      { "Zeitzone einstellen" = "benutzer/persoenliche-einstellungen/zeitzone-einstellen.md" },
      { "Profil und E-Mail-Signatur" = "benutzer/persoenliche-einstellungen/profil-und-signatur.md" },
      { "Benachrichtigungen per E-Mail oder in Atrion" = "benutzer/persoenliche-einstellungen/benachrichtigungen.md" },
      { "Darstellung hell oder dunkel" = "benutzer/persoenliche-einstellungen/darstellung.md" },
    ] },
    { "Arbeiten mit Atrion" = [
      "benutzer/arbeiten-mit-atrion/index.md",
      { "Apps und Menüs" = "benutzer/arbeiten-mit-atrion/apps-und-menues.md" },
      { "Befehlspalette" = "benutzer/arbeiten-mit-atrion/befehlspalette.md" },
      { "Tastaturkürzel" = "benutzer/arbeiten-mit-atrion/tastaturkuerzel.md" },
      { "Ansichten wechseln" = "benutzer/arbeiten-mit-atrion/ansichten-wechseln.md" },
      { "Suchen" = "benutzer/arbeiten-mit-atrion/suchen.md" },
      { "Filtern" = "benutzer/arbeiten-mit-atrion/filtern.md" },
      { "Gruppieren" = "benutzer/arbeiten-mit-atrion/gruppieren.md" },
      { "Favoriten speichern" = "benutzer/arbeiten-mit-atrion/favoriten.md" },
      { "Sortieren und blättern" = "benutzer/arbeiten-mit-atrion/sortieren-und-blaettern.md" },
      { "Spalten ein- und ausblenden" = "benutzer/arbeiten-mit-atrion/spalten-anpassen.md" },
      { "Mehrere Datensätze auswählen und bearbeiten" = "benutzer/arbeiten-mit-atrion/auswaehlen-und-massenbearbeitung.md" },
      { "Datensatz anlegen und bearbeiten" = "benutzer/arbeiten-mit-atrion/datensatz-bearbeiten.md" },
      { "Änderungen verwerfen" = "benutzer/arbeiten-mit-atrion/aenderungen-verwerfen.md" },
      { "Datensatz duplizieren" = "benutzer/arbeiten-mit-atrion/duplizieren.md" },
      { "Archivieren, wiederherstellen und löschen" = "benutzer/arbeiten-mit-atrion/archivieren-und-loeschen.md" },
      { "Exportieren" = "benutzer/arbeiten-mit-atrion/exportieren.md" },
      { "Importieren" = "benutzer/arbeiten-mit-atrion/importieren.md" },
    ] },
    { "Zusammenarbeit" = [
      "benutzer/zusammenarbeit/index.md",
      { "Nachrichten und Notizen" = "benutzer/zusammenarbeit/chatter.md" },
      { "Aktivitäten planen" = "benutzer/zusammenarbeit/aktivitaeten.md" },
      { "Datensätzen folgen" = "benutzer/zusammenarbeit/folgen.md" },
      { "Anhänge hinzufügen" = "benutzer/zusammenarbeit/anhaenge.md" },
      { "Posteingang und Erwähnungen" = "benutzer/zusammenarbeit/posteingang.md" },
      { "Direktnachrichten und Kanäle" = "benutzer/zusammenarbeit/discuss.md" },
    ] },
    { "Administration" = [
      "benutzer/administration/index.md",
      { "Benutzer:in einladen" = "benutzer/administration/benutzer-einladen.md" },
      { "Zugriffsrechte setzen" = "benutzer/administration/zugriffsrechte-setzen.md" },
      { "Passwort einer Person zurücksetzen" = "benutzer/administration/passwort-fuer-andere-zuruecksetzen.md" },
    ] },
  ] },
  { "Technik" = "technik/index.md" },
]
# NAV-ENDE

[project.theme]
language = "de"
logo = "assets/images/logo-weiss.svg"
favicon = "assets/images/favicon.svg"
# Schriften lokal ausgeliefert (keine Google Fonts), siehe assets/stylesheets/fonts.css
font = false
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Dunkle Darstellung"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Helle Darstellung"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
